name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit repository invariants
        run: python3 scripts/check_repository.py

      - name: Verify internal Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Kotlin formatting and style
        run: gradle :shared:ktlintCheck :androidApp:ktlintCheck :desktopApp:ktlintCheck

      - name: Run shared JVM tests
        run: gradle :shared:desktopTest

      - name: Run desktop JVM tests
        run: gradle :desktopApp:test

      - name: Run Android unit tests
        run: gradle :androidApp:testDebugUnitTest

      - name: Run Android release lint
        run: gradle :androidApp:lintRelease

      - name: Assemble debug application
        run: gradle :androidApp:assembleDebug

      - name: Assemble unsigned release candidate
        run: gradle :androidApp:assembleRelease

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: androidApp/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-unsigned-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
