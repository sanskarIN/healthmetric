name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Kotlin formatting and style
        run: gradle :shared:ktlintCheck :androidApp:ktlintCheck

      - name: Run shared JVM tests
        run: gradle :shared:desktopTest

      - name: Run Android unit tests
        run: gradle :androidApp:testDebugUnitTest

      - name: Run Android lint
        run: gradle :androidApp:lintDebug

      - name: Assemble debug application
        run: gradle :androidApp:assembleDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: androidApp/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
