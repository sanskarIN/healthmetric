name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit repository invariants
        run: python3 scripts/check_repository.py

      - name: Verify internal Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Verify release tag matches project versions
        run: python3 scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Verify release tag targets current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "${release_sha}" != "${main_sha}" ]]; then
            echo "Release tags must target the current main commit." >&2
            echo "tag commit:  ${release_sha}" >&2
            echo "main commit: ${main_sha}" >&2
            exit 1
          fi

  android-release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Android release inputs
        run: >-
          gradle
          :shared:desktopTest
          :shared:ktlintCheck
          :androidApp:ktlintCheck
          :androidApp:testDebugUnitTest
          :androidApp:lintRelease

      - name: Assemble unsigned Android artifacts
        run: gradle :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Stage Android release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_file="$(find androidApp/build/outputs/apk/release -type f -name '*-unsigned.apk' -print -quit)"
          aab_file="$(find androidApp/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "${apk_file}"
          test -n "${aab_file}"
          cp "${apk_file}" "release-assets/healthmetric-${GITHUB_REF_NAME}-android-unsigned.apk"
          cp "${aab_file}" "release-assets/healthmetric-${GITHUB_REF_NAME}-android-unsigned.aab"

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-${{ github.ref_name }}-release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  desktop-release:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
            native_task: packageDeb
            native_dir: deb
            native_ext: deb
          - os: windows-latest
            artifact_os: windows
            native_task: packageMsi
            native_dir: msi
            native_ext: msi
          - os: macos-latest
            artifact_os: macos
            native_task: packageDmg
            native_dir: dmg
            native_ext: dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify desktop release inputs
        run: gradle :desktopApp:ktlintCheck :desktopApp:test

      - name: Package current-OS desktop artifacts
        run: gradle :desktopApp:packageUberJarForCurrentOS :desktopApp:${{ matrix.native_task }}

      - name: Stage Unix desktop release assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          jar_file="$(find desktopApp/build/compose/jars -type f -name '*.jar' -print -quit)"
          native_file="$(find desktopApp/build/compose/binaries/main/${{ matrix.native_dir }} -type f -name '*.${{ matrix.native_ext }}' -print -quit)"
          test -n "${jar_file}"
          test -n "${native_file}"
          cp "${jar_file}" "release-assets/healthmetric-${GITHUB_REF_NAME}-desktop-${{ matrix.artifact_os }}.jar"
          cp "${native_file}" "release-assets/healthmetric-${GITHUB_REF_NAME}-desktop-${{ matrix.artifact_os }}.${{ matrix.native_ext }}"

      - name: Stage Windows desktop release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $jar = Get-ChildItem "desktopApp/build/compose/jars/*.jar" | Select-Object -First 1
          $native = Get-ChildItem "desktopApp/build/compose/binaries/main/${{ matrix.native_dir }}/*.${{ matrix.native_ext }}" | Select-Object -First 1
          if (-not $jar) { throw "No desktop runnable JAR was produced." }
          if (-not $native) { throw "No desktop native installer was produced." }
          Copy-Item $jar.FullName "release-assets/healthmetric-${env:GITHUB_REF_NAME}-desktop-windows.jar"
          Copy-Item $native.FullName "release-assets/healthmetric-${env:GITHUB_REF_NAME}-desktop-windows.${{ matrix.native_ext }}"

      - name: Upload desktop release assets
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-${{ github.ref_name }}-release-desktop-${{ matrix.artifact_os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs:
      - android-release
      - desktop-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          pattern: healthmetric-${{ github.ref_name }}-release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "healthmetric-${GITHUB_REF_NAME}-android-unsigned.apk"
            "healthmetric-${GITHUB_REF_NAME}-android-unsigned.aab"
            "healthmetric-${GITHUB_REF_NAME}-desktop-linux.jar"
            "healthmetric-${GITHUB_REF_NAME}-desktop-linux.deb"
            "healthmetric-${GITHUB_REF_NAME}-desktop-windows.jar"
            "healthmetric-${GITHUB_REF_NAME}-desktop-windows.msi"
            "healthmetric-${GITHUB_REF_NAME}-desktop-macos.jar"
            "healthmetric-${GITHUB_REF_NAME}-desktop-macos.dmg"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/${asset}"
          done
          ls -lah release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "HealthMetric ${GITHUB_REF_NAME}"
