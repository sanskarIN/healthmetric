name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Audit repository invariants
        run: python scripts/check_repository.py

      - name: Verify internal Markdown links
        run: python scripts/check_markdown_links.py

      - name: Run repository tooling tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Verify release tag matches project versions
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Verify release tag targets current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "${release_sha}" != "${main_sha}" ]]; then
            echo "Release tags must target the current main commit." >&2
            echo "tag commit:  ${release_sha}" >&2
            echo "main commit: ${main_sha}" >&2
            exit 1
          fi

  android-release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Android release inputs
        run: >-
          gradle
          :shared:desktopTest
          :shared:ktlintCheck
          :androidApp:ktlintCheck
          :androidApp:testDebugUnitTest
          :androidApp:lintRelease

      - name: Assemble unsigned Android artifacts
        run: gradle :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Stage Android release assets
        run: python scripts/stage_release_assets.py android --tag "${GITHUB_REF_NAME}"

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-${{ github.ref_name }}-release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  desktop-release:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
            native_task: packageDeb
          - os: windows-latest
            artifact_os: windows
            native_task: packageMsi
          - os: macos-latest
            artifact_os: macos
            native_task: packageDmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify desktop release inputs
        run: gradle :desktopApp:ktlintCheck :desktopApp:test

      - name: Package current-OS desktop artifacts
        run: gradle :desktopApp:packageUberJarForCurrentOS :desktopApp:${{ matrix.native_task }}

      - name: Stage desktop release assets
        run: >-
          python scripts/stage_release_assets.py desktop
          --tag "${{ github.ref_name }}"
          --platform "${{ matrix.artifact_os }}"

      - name: Upload desktop release assets
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-${{ github.ref_name }}-release-desktop-${{ matrix.artifact_os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs:
      - android-release
      - desktop-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          pattern: healthmetric-${{ github.ref_name }}-release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "healthmetric-${GITHUB_REF_NAME}-android-unsigned.apk"
            "healthmetric-${GITHUB_REF_NAME}-android-unsigned.aab"
            "healthmetric-${GITHUB_REF_NAME}-desktop-linux.jar"
            "healthmetric-${GITHUB_REF_NAME}-desktop-linux.deb"
            "healthmetric-${GITHUB_REF_NAME}-desktop-windows.jar"
            "healthmetric-${GITHUB_REF_NAME}-desktop-windows.msi"
            "healthmetric-${GITHUB_REF_NAME}-desktop-macos.jar"
            "healthmetric-${GITHUB_REF_NAME}-desktop-macos.dmg"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/${asset}"
          done
          ls -lah release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "HealthMetric ${GITHUB_REF_NAME}"
