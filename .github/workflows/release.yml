name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify release inputs
        run: gradle :shared:desktopTest :shared:ktlintCheck :androidApp:ktlintCheck :androidApp:testDebugUnitTest :androidApp:lintRelease

      - name: Assemble unsigned release APK
        run: gradle :androidApp:assembleRelease

      - name: Assemble unsigned release App Bundle
        run: gradle :androidApp:bundleRelease

      - name: Upload unsigned Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-${{ github.ref_name }}-unsigned-android
          path: |
            androidApp/build/outputs/apk/release/*-unsigned.apk
            androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            androidApp/build/outputs/apk/release/*-unsigned.apk \
            androidApp/build/outputs/bundle/release/*.aab \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "HealthMetric ${GITHUB_REF_NAME}"
