name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit repository invariants
        run: python3 scripts/check_repository.py

      - name: Verify internal Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Verify release version metadata
        run: python3 scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Verify release inputs
        run: gradle :shared:desktopTest :shared:ktlintCheck :androidApp:ktlintCheck :androidApp:testDebugUnitTest :androidApp:lintRelease

      - name: Assemble unsigned release APK
        run: gradle :androidApp:assembleRelease

      - name: Build unsigned release App Bundle
        run: gradle :androidApp:bundleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-${{ github.ref_name }}-unsigned-apk
          path: androidApp/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-${{ github.ref_name }}-unsigned-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            androidApp/build/outputs/apk/release/*-unsigned.apk \
            androidApp/build/outputs/bundle/release/*.aab \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "HealthMetric ${GITHUB_REF_NAME}"
