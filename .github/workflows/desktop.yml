name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
          - os: windows-latest
            artifact_os: windows
          - os: macos-latest
            artifact_os: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify desktop formatting
        run: gradle :desktopApp:ktlintCheck

      - name: Run desktop tests
        run: gradle :desktopApp:test

      - name: Package current-OS runnable JAR
        run: gradle :desktopApp:packageUberJarForCurrentOS

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-desktop-${{ matrix.artifact_os }}-jar
          path: desktopApp/build/compose/jars/*.jar
          if-no-files-found: error
          retention-days: 14
