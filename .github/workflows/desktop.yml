name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
            native_task: packageDeb
            native_glob: desktopApp/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            artifact_os: windows
            native_task: packageMsi
            native_glob: desktopApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            artifact_os: macos
            native_task: packageDmg
            native_glob: desktopApp/build/compose/binaries/main/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify desktop formatting
        run: gradle :desktopApp:ktlintCheck

      - name: Run desktop tests
        run: gradle :desktopApp:test

      - name: Package current-OS runnable JAR
        run: gradle :desktopApp:packageUberJarForCurrentOS

      - name: Package native desktop installer
        run: gradle :desktopApp:${{ matrix.native_task }}

      - name: Upload desktop verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-desktop-${{ matrix.artifact_os }}
          path: |
            desktopApp/build/compose/jars/*.jar
            ${{ matrix.native_glob }}
          if-no-files-found: error
          retention-days: 14
