name: Desktop native packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux DEB
            task: :desktopApp:packageDeb
            artifact: healthmetric-linux-deb
            path: desktopApp/build/compose/binaries/main/deb/*.deb
          - os: macos-latest
            label: macOS DMG
            task: :desktopApp:packageDmg
            artifact: healthmetric-macos-dmg
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            label: Windows MSI
            task: :desktopApp:packageMsi
            artifact: healthmetric-windows-msi
            path: desktopApp/build/compose/binaries/main/msi/*.msi

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: runner.os != 'Windows'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Android SDK packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          1..20 | ForEach-Object { "y" } | sdkmanager.bat --licenses | Out-Null
          sdkmanager.bat "platforms;android-36" "build-tools;35.0.0"

      - name: Verify desktop formatting
        run: gradle :desktopApp:ktlintCheck :sharedUI:ktlintCheck

      - name: Build native package
        run: gradle ${{ matrix.task }}

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
