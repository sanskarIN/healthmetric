name: Cross-platform clients

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android compile SDK for shared project configuration
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify cross-platform Kotlin formatting
        run: gradle :shared:ktlintCheck :sharedUI:ktlintCheck :desktopApp:ktlintCheck :webApp:ktlintCheck

      - name: Run shared domain tests
        run: gradle :shared:desktopTest

      - name: Compile shared logic for JavaScript and Wasm
        run: gradle :shared:compileKotlinJs :shared:compileKotlinWasmJs

      - name: Compile shared UI for desktop JavaScript and Wasm
        run: gradle :sharedUI:compileKotlinDesktop :sharedUI:compileKotlinJs :sharedUI:compileKotlinWasmJs

      - name: Compile desktop application
        run: gradle :desktopApp:compileKotlin

      - name: Build JavaScript web distribution
        run: gradle :webApp:jsBrowserProductionWebpack

      - name: Build Wasm web distribution
        run: gradle :webApp:wasmJsBrowserProductionWebpack

      - name: Upload JavaScript web distribution
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-web-js
          path: webApp/build/dist/js/productionExecutable/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wasm web distribution
        uses: actions/upload-artifact@v7
        with:
          name: healthmetric-web-wasm
          path: webApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 14
