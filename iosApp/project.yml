name: HealthMetricIOS
options:
  bundleIdPrefix: io.github.sanskarin.healthmetric
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  HealthMetric:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HealthMetric
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sanskarin.healthmetric.ios
        PRODUCT_NAME: HealthMetric
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HealthMetric
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedUI/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -framework HealthMetricUI"
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-NO}" = "YES" ]; then
            echo "Skipping Kotlin framework build because OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          if [ -x "./gradlew" ]; then
            ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
          elif command -v gradle >/dev/null 2>&1; then
            gradle :sharedUI:embedAndSignAppleFrameworkForXcode
          else
            echo "Gradle 8.13 is required. Install Gradle or generate the repository wrapper before building the iOS host." >&2
            exit 1
          fi
schemes:
  HealthMetric:
    build:
      targets:
        HealthMetric: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
